    <text x="49" y="88" text-anchor="middle" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="76" font-weight="600" fill="url(#sqMetalGold)" stroke="#1a050a" stroke-width="1.2">A</text>
    <text x="79" y="93" text-anchor="middle" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="76" font-weight="600" fill="url(#sqMetalGold)" stroke="#1a050a" stroke-width="1.6">A</text>
