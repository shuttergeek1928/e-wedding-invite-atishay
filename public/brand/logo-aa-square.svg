      <stop offset="0%" stop-color="#4a1522"/>
      <stop offset="60%" stop-color="#2a0a12"/>
      <stop offset="100%" stop-color="#140307"/>
    </radialGradient>

    <linearGradient id="sqMetalGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="20%" stop-color="#ebd197"/>
      <stop offset="40%" stop-color="#c99d4f"/>
      <stop offset="52%" stop-color="#faecc9"/>
      <stop offset="70%" stop-color="#b68535"/>
